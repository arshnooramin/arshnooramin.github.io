<header class="site-header">
  <nav class="site-nav">
    <div class="nav-container">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>
        <p class="site-subtitle">{{ page.title | default: 'Software Engineer' }}</p>
      </div>
      
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <ul class="nav-menu" id="navMenu">
        <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
        <li><a href="{{ '/#portfolio' | relative_url }}" class="nav-link">Portfolio</a></li>
        <li><a href="{{ '/resume/' | relative_url }}" class="nav-link">Résumé</a></li>
        <li><a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a></li>
        
        <li class="nav-social">
          <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<script>
  const navToggle = document.getElementById('navToggle');
  const navMenu = document.getElementById('navMenu');
  
  navToggle.addEventListener('click', () => {
    navMenu.classList.toggle('active');
  });
</script>
