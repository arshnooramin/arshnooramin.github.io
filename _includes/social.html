<span class="social">
  {%- if site.email %}<a href="mailto:{{ site.email }}" aria-label="Email" title="{{ site.email }}">{% include icons/mail.svg %}</a>{% endif -%}
  {%- if site.social.github %}<a href="{{ site.social.github }}" rel="noopener" aria-label="GitHub" title="GitHub">{% include icons/github.svg %}</a>{% endif -%}
  {%- if site.social.linkedin %}<a href="{{ site.social.linkedin }}" rel="noopener" aria-label="LinkedIn" title="LinkedIn">{% include icons/linkedin.svg %}</a>{% endif -%}
</span>
