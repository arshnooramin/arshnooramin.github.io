# Work experience, newest first. Shown in the "experience" section on the home page.
# Keep summaries to a line or two; the resume PDF has the full details.
# Each company can hold several roles (e.g. team moves within the same company).
# Optional `url` on a company links its name.
# Optional `logo` replaces the name with an image. It's filled with a single color (white by default).
# Optional `logo_color` changes that color: a palette name like var(--yellow) or any CSS color, e.g. "#ff7b72".
# Optional `logo_height` sizes the logo (any CSS length, e.g. 1.75rem or 28px; default 1.5rem).
# `summary` is Markdown, so links work: [text](https://...). Quote it if it starts with [.

- company: Bloomberg LP
